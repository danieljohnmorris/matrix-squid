<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b10" />
  <meta name="description" content="A procedural Three.js Sentinel swarm. Coast, propel and sense." />
  <title>Matrix Squid</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080b10; color: #d5dce5; }
    body { margin: 0; overflow: hidden; }
    #sentinel-background { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .controls { position: fixed; top: max(24px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: calc(100% - 48px); }
    .controls > * { box-sizing: border-box; display: grid; place-items: center; width: 44px; height: 44px; padding: 10px; border: 1px solid #ffffff30; border-radius: 6px; background: #080b10cc; color: inherit; cursor: pointer; }
    .controls > *:hover { border-color: #ffffff70; }
    .controls > *:focus-visible { outline: 2px solid #d5dce5; outline-offset: 4px; }
    .controls > [hidden] { display: none; }
    .controls .population:not([hidden]) { display: flex; gap: 6px; width: auto; padding: 0 10px; font-size: 13px; cursor: default; }
    .population select { height: 42px; border: 0; background: transparent; color: inherit; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; }
    .population select:focus-visible { outline: 2px solid #d5dce5; outline-offset: 2px; }
    .population option { background: #080b10; }
    .controls svg { display: block; width: 20px; height: 20px; pointer-events: none; }
    .controls .icon-active, .controls [aria-pressed="true"] .icon-default { display: none; }
    .controls [aria-pressed="true"] .icon-active { display: block; }
    .hint { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: max(24px, env(safe-area-inset-left)); margin: 0; color: #8f9aa9; font-size: 12px; pointer-events: none; }
    .controls, .hint { transition: opacity 180ms ease; }
    .ui-idle .controls:not(:has(:focus-visible, :active)), .ui-idle .hint { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      .controls, .hint { transition: none; }
    }
    #status { position: fixed; inset: 40% 24px auto; text-align: center; }
    .screensaver .controls, .screensaver .hint { display: none; }
    .screensaver, .screensaver * { cursor: none; }
  </style>
</head>
<body>
  <main aria-label="Animated Sentinel squid swarm"><div id="sentinel-background" aria-hidden="true"></div></main>
  <p id="status" role="status"></p>
  <nav class="controls" aria-label="Scene controls">
    <div class="population" id="squid-population" hidden>
      <label for="squid-count">Squid</label>
      <select id="squid-count" title="Number of squid"></select>
    </div>
    <button id="sentinel-pathing" type="button" aria-label="Flocking pathing" aria-pressed="false" title="Independent — switch to flocking" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <g class="icon-default"><path d="M9 9 4 4m0 0v5m0-5h5M15 9l5-5m0 0h-5m5 0v5M12 14v7m0 0-3-3m3 3 3-3" /></g>
        <g class="icon-active"><path d="M5 19V9m0 0-3 3m3-3 3 3M12 15V5m0 0L9 8m3-3 3 3M19 19V9m0 0-3 3m3-3 3 3" /></g>
      </svg>
    </button>
    <button id="sentinel-motion" type="button" aria-label="Pause sentinels" title="Pause sentinels" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <g class="icon-default"><path d="M8 5v14M16 5v14" stroke-width="3" /></g>
        <path class="icon-active" d="m7 4 14 8-14 8Z" />
      </svg>
    </button>
    <button id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path class="icon-default" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
        <path class="icon-active" d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5" />
      </svg>
    </button>
    <a href="https://github.com/danieljohnmorris/matrix-squid" target="_blank" rel="noopener noreferrer" aria-label="Matrix Squid on GitHub (opens in a new tab)" title="View on GitHub (opens in a new tab)">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
      </svg>
    </a>
  </nav>
  <p class="hint">Drag to orbit · Scroll or pinch to zoom</p>
  <noscript>Enable JavaScript to view the Sentinel swarm.</noscript>
  <script type="module" src="/main.js"></script>
</body>
</html>
